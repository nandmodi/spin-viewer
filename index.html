<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° Spin Viewer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    </style>
</head>
<body class="h-full flex flex-col m-0 p-0 overflow-hidden bg-slate-950 antialiased">

    <!-- Minimal Header with SKU Input Box -->
    <header class="w-full bg-slate-900 border-b border-slate-800 p-3 sm:p-4 shrink-0 shadow-lg z-20">
        <div class="max-w-4xl mx-auto flex items-center gap-2 sm:gap-3">
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-blue-400 text-sm"></i>
                </div>
                <input 
                    type="text" 
                    id="skuInput" 
                    placeholder="Enter SKU Input (e.g. 2HGFE4F88TH316229)..." 
                    class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-white text-sm rounded-xl pl-10 pr-10 py-2.5 transition-all font-mono outline-none"
                />
                <button 
                    onclick="clearInput()" 
                    id="clearBtn" 
                    class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300 transition-colors"
                >
                    <i class="fa-solid fa-circle-xmark text-sm"></i>
                </button>
            </div>

            <button 
                onclick="runQueryAndFetchSpin()" 
                id="searchBtn"
                class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium text-sm rounded-xl shadow-md transition-all flex items-center gap-2 shrink-0"
            >
                <i class="fa-solid fa-play text-xs"></i>
                <span class="hidden sm:inline">Fetch Spin</span>
            </button>
        </div>
    </header>

    <!-- Clickable Spin URL Banner (Visible when URL is fetched) -->
    <div id="urlBanner" class="hidden w-full bg-slate-900/90 border-b border-slate-800 px-3 py-2 shrink-0 z-10 transition-all">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-2 min-w-0 flex-1">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium shrink-0">
                    <i class="fa-solid fa-link text-[10px]"></i> Spin URL
                </span>
                <!-- Clickable Link to URL -->
                <a 
                    id="spinUrlLink" 
                    href="#" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="text-blue-400 hover:text-blue-300 underline font-mono truncate transition-colors"
                    title="Click to open spin URL in new tab"
                >
                    <!-- Populated dynamically -->
                </a>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <button 
                    onclick="copySpinUrl()" 
                    id="copyBtn" 
                    class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition-colors flex items-center gap-1.5"
                    title="Copy URL to clipboard"
                >
                    <i class="fa-regular fa-copy text-[11px]"></i>
                    <span class="hidden sm:inline">Copy</span>
                </button>
                <a 
                    id="openTabBtn" 
                    href="#" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="px-2.5 py-1 bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 rounded-lg border border-blue-500/30 transition-colors flex items-center gap-1.5"
                    title="Open in new window"
                >
                    <i class="fa-solid fa-arrow-up-right-from-square text-[11px]"></i>
                    <span class="hidden sm:inline">Open URL</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Main Frame Viewport -->
    <main class="flex-1 w-full h-full relative bg-slate-950 flex items-center justify-center overflow-hidden">
        
        <!-- Status Overlay (Idle / Loading / Error) -->
        <div id="statusState" class="absolute inset-0 bg-slate-950 z-10 flex flex-col items-center justify-center gap-3 p-6 text-center">
            <div id="statusIcon" class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-500">
                <i class="fa-solid fa-rotate text-xl"></i>
            </div>
            <div id="statusTitle" class="text-sm font-medium text-slate-300">Enter a SKU Input above to load 360° Spin</div>
            <div id="statusSubtitle" class="text-xs text-slate-500 max-w-sm hidden"></div>
            <button id="retryBtn" onclick="runQueryAndFetchSpin()" class="hidden mt-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg transition-colors">
                <i class="fa-solid fa-rotate-right mr-1.5"></i> Try Again
            </button>
        </div>

        <!-- Target Spin iFrame -->
        <iframe 
            id="spinIframe" 
            class="hidden w-full h-full border-0" 
            allowfullscreen 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        ></iframe>
    </main>

    <script>
        // Constants moved to backend (api/fetch-spin.js), no longer exposed on frontend.
        const skuInput = document.getElementById('skuInput');
        const clearBtn = document.getElementById('clearBtn');
        const urlBanner = document.getElementById('urlBanner');
        const spinUrlLink = document.getElementById('spinUrlLink');
        const openTabBtn = document.getElementById('openTabBtn');
        const spinIframe = document.getElementById('spinIframe');
        const statusState = document.getElementById('statusState');
        const statusIcon = document.getElementById('statusIcon');
        const statusTitle = document.getElementById('statusTitle');
        const statusSubtitle = document.getElementById('statusSubtitle');
        const retryBtn = document.getElementById('retryBtn');

        let currentFetchedUrl = '';

        document.addEventListener('DOMContentLoaded', () => {
            spinIframe.addEventListener('load', handleIframeLoad);
            skuInput.addEventListener('input', toggleClearBtn);
            skuInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') runQueryAndFetchSpin();
            });

            // Read URL parameter if available
            const params = new URLSearchParams(window.location.search);
            const initialSku = params.get('sku_input') || params.get('sku_id') || params.get('sku') || params.get('mediaId');
            if (initialSku) {
                skuInput.value = initialSku;
                toggleClearBtn();
                runQueryAndFetchSpin();
            }
        });

        function toggleClearBtn() {
            if (skuInput.value.trim().length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        function clearInput() {
            skuInput.value = '';
            toggleClearBtn();
            urlBanner.classList.add('hidden');
            skuInput.focus();
        }

        function setStatus(type, title, subtitle = '') {
            statusState.classList.remove('hidden');
            statusSubtitle.classList.add('hidden');
            retryBtn.classList.add('hidden');

            if (type === 'idle') {
                statusIcon.innerHTML = '<i class="fa-solid fa-rotate text-xl text-slate-500"></i>';
                statusTitle.textContent = title;
            } else if (type === 'loading') {
                statusIcon.innerHTML = '<div class="w-6 h-6 border-2 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>';
                statusTitle.textContent = title;
                if (subtitle) {
                    statusSubtitle.textContent = subtitle;
                    statusSubtitle.classList.remove('hidden');
                }
            } else if (type === 'error') {
                statusIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-xl text-amber-500"></i>';
                statusTitle.textContent = title;
                if (subtitle) {
                    statusSubtitle.textContent = subtitle;
                    statusSubtitle.classList.remove('hidden');
                }
                retryBtn.classList.remove('hidden');
            }
        }

        async function runQueryAndFetchSpin() {
            const sku = skuInput.value.trim();
            if (!sku) {
                setStatus('idle', 'Please enter a valid SKU Input');
                urlBanner.classList.add('hidden');
                return;
            }

            // Hide iframe and show querying state
            spinIframe.classList.add('hidden');
            spinIframe.src = 'about:blank';
            urlBanner.classList.add('hidden');

            updateUrlParam(sku);

            // 1. Direct URL Input
            if (sku.startsWith('http://') || sku.startsWith('https://') || sku.includes('assets.spyne.ai')) {
                const directUrl = sku.startsWith('http') ? sku : `https://${sku}`;
                showSpinUrlBanner(directUrl);
                setStatus('loading', 'Loading 360° Spin viewer...', directUrl);
                spinIframe.src = directUrl;
                spinIframe.classList.remove('hidden');
                return;
            }

            // 2. Direct Media ID Input (24-character hex ID)
            if (/^[a-fA-F0-9]{24}$/.test(sku)) {
                const constructedUrl = `https://assets.spyne.ai/360?version=v3&mediaId=${sku}&spin=1`;
                showSpinUrlBanner(constructedUrl);
                setStatus('loading', 'Loading 360° Spin viewer...', constructedUrl);
                spinIframe.src = constructedUrl;
                spinIframe.classList.remove('hidden');
                return;
            }

            // 3. Query our own Vercel Serverless API Backend!
            setStatus('loading', 'Executing secure backend query...', `Fetching via Vercel...`);
            
            try {
                // We call the serverless function we created in /api/fetch-spin.js
                // This request is internal (same domain), so the browser doesn't block it with CORS!
                const res = await fetch(`/api/fetch-spin?sku=${encodeURIComponent(sku)}`);
                
                if (!res.ok) {
                    throw new Error(`Server returned HTTP ${res.status}`);
                }
                
                const data = await res.json();
                
                // Extract the URL using the existing robust logic
                const urlFound = extractSpinUrl(data);
                
                if (urlFound) {
                    showSpinUrlBanner(urlFound);
                    setStatus('loading', 'Opening 360° Spin URL...', urlFound);
                    spinIframe.src = urlFound;
                    spinIframe.classList.remove('hidden');
                } else {
                    throw new Error('Valid spin_url not found in payload');
                }
            } catch (err) {
                console.error("Vercel Backend Error:", err);
                setStatus('error', `No 360 spin URL found for "${sku}"`, 'The query timed out, failed, or returned no matches. Check the SKU.');
            }
        }

        function extractSpinUrl(data) {
            if (!data) return null;

            // Normalize data into an array of row objects to search through
            let rows = [];
            
            // Check if data is directly an array (Metabase JSON export format)
            if (Array.isArray(data)) {
                rows = data;
            } else if (data.data && Array.isArray(data.data.rows)) {
                // If it's wrapped in a data object
                rows = data.data.rows;
            } else if (typeof data === 'object') {
                rows = [data];
            }

            for (const row of rows) {
                if (!row || typeof row !== 'object') continue;

                // 1. Check for exact column mapping: `spin_url`
                if (row.spin_url && typeof row.spin_url === 'string' && row.spin_url.startsWith('http')) {
                    return row.spin_url.trim();
                }

                // 2. Check for exact column mapping: `mediaId`
                if (row.mediaId && typeof row.mediaId === 'string' && row.mediaId.length >= 20) {
                    return `https://assets.spyne.ai/360?version=v3&mediaId=${row.mediaId}&spin=1`;
                }
                
                // Fallbacks...
                if (row.media_id && typeof row.media_id === 'string' && row.media_id.length >= 20) {
                    return `https://assets.spyne.ai/360?version=v3&mediaId=${row.media_id}&spin=1`;
                }

                // If data is just a raw array of cells (Metabase raw format)
                if (Array.isArray(row)) {
                    for (const cell of row) {
                        if (typeof cell === 'string') {
                            if (cell.includes('assets.spyne.ai/360')) return cell.trim();
                            if (/^[a-fA-F0-9]{24}$/.test(cell)) {
                                return `https://assets.spyne.ai/360?version=v3&mediaId=${cell}&spin=1`;
                            }
                        }
                    }
                }
            }

            return null;
        }

        function showSpinUrlBanner(url) {
            currentFetchedUrl = url;
            spinUrlLink.href = url;
            spinUrlLink.textContent = url;
            openTabBtn.href = url;
            urlBanner.classList.remove('hidden');
        }

        function copySpinUrl() {
            if (!currentFetchedUrl) return;
            
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = currentFetchedUrl;
            dummy.select();
            
            try {
                document.execCommand('copy');
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerHTML = '<i class="fa-solid fa-check text-[11px] text-emerald-400"></i><span class="hidden sm:inline text-emerald-400">Copied!</span>';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy text-[11px]"></i><span class="hidden sm:inline">Copy</span>';
                }, 2000);
            } catch (e) {
                console.error('Failed to copy text', e);
            } finally {
                document.body.removeChild(dummy);
            }
        }

        function handleIframeLoad() {
            if (spinIframe.src && spinIframe.src !== 'about:blank') {
                statusState.classList.add('hidden');
            }
        }

        function updateUrlParam(sku) {
            try {
                if (window.location.protocol !== 'blob:' && window.location.href.startsWith('http')) {
                    const currentUrl = new URL(window.location.href);
                    currentUrl.searchParams.set('sku_input', sku);
                    window.history.replaceState({}, '', currentUrl);
                }
            } catch (err) {
                console.warn('Unable to update address bar:', err);
            }
        }
    </script>
</body>
</html>
